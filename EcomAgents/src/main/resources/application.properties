spring.application.name=EcomAgents

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/ecomagents
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=sh0918

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=8888

# File upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
file.upload-dir=./uploads

# CORS 跨域白名单（逗号分隔，支持通配符 *，为空则严格同源）
cors.allowed-origins=http://localhost:5174,http://localhost:5173,http://192.168.*:5174,http://192.168.*:5173,http://127.0.0.1:5174,http://127.0.0.1:5173

# Skill Import — gh-proxy 加速地址（用于 git clone 下载技能仓库）
skill.gh-proxy-url=https://gh-proxy.org

# LLM Configuration (also configurable via env vars LLM_API_KEY, LLM_MODEL, etc.)
# llm.api-url=https://api.openai.com/v1/chat/completions
# llm.api-key=sk-placeholder
# llm.model=gpt-4o-mini
# llm.max-tokens=2048
# llm.temperature=0.7
# llm.stream-timeout=60
# llm.connection-timeout=30
# llm.read-timeout=55
# llm.embedding-provider=ollama
# llm.embedding-api-url=http://localhost:11434
# llm.embedding-api-key=sk-placeholder
# llm.embedding-model=bge-m3:latest
# llm.embedding-dimension=1024
# llm.rag-search-limit=5
# llm.rag-similarity-threshold=0.15
# llm.rag-retrieval-timeout=8
# llm.rag-max-context-chars=8000

# 图片生成 — gpt-image-2（PackyAPI）
image.timeout-seconds=300

# Token 定价汇率（美元兑人民币）
token-pricing.usd-cny-rate=6.8

# JWT Configuration（生产环境请通过 JWT_SECRET 环境变量覆盖）
jwt.secret=EcomAgents2024SecretKeyForJWTTokenGenerationMustBe256BitsLong
jwt.expiration=86400
