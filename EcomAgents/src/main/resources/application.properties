spring.application.name=EcomAgents

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/ecomagents
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=liang19951719

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=8888

# File upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
file.upload-dir=./uploads

# Skill Import — gh-proxy 加速地址（用于 git clone 下载技能仓库）
skill.gh-proxy-url=https://gh-proxy.org

# LLM Configuration (also configurable via env vars LLM_API_KEY, LLM_MODEL, etc.)
# llm.api-url=https://api.openai.com/v1/chat/completions
# llm.api-key=sk-placeholder
# llm.model=gpt-4o-mini
# llm.max-tokens=2048
# llm.temperature=0.7
# llm.stream-timeout=60
# llm.connection-timeout=30
# llm.read-timeout=55

# JWT Configuration（生产环境请通过 JWT_SECRET 环境变量覆盖）
jwt.secret=EcomAgents2024SecretKeyForJWTTokenGenerationMustBe256BitsLong
jwt.expiration=86400
