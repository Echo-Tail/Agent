spring.application.name=EcomAgents
spring.codec.max-in-memory-size=${WEBCLIENT_MAX_IN_MEMORY_SIZE:20MB}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/ecomagents
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=sh0918

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
model.credentials.master-key=${MODEL_CREDENTIAL_MASTER_KEY:}
image.runtime.mock-adapter-enabled=${IMAGE_RUNTIME_MOCK_ADAPTER_ENABLED:false}
image.runtime.worker-enabled=${IMAGE_RUNTIME_WORKER_ENABLED:true}
image.runtime.worker-concurrency=${IMAGE_RUNTIME_WORKER_CONCURRENCY:2}
image.runtime.lease-seconds=${IMAGE_RUNTIME_LEASE_SECONDS:60}
image.runtime.poll-interval-ms=${IMAGE_RUNTIME_POLL_INTERVAL_MS:1000}
image.runtime.heartbeat-interval-ms=${IMAGE_RUNTIME_HEARTBEAT_INTERVAL_MS:20000}
image.runtime.recovery-interval-ms=${IMAGE_RUNTIME_RECOVERY_INTERVAL_MS:30000}
image.runtime.max-attempts=${IMAGE_RUNTIME_MAX_ATTEMPTS:3}
image.runtime.retry-base-seconds=${IMAGE_RUNTIME_RETRY_BASE_SECONDS:5}
image.runtime.provider-poll-seconds=${IMAGE_RUNTIME_PROVIDER_POLL_SECONDS:3}
image.runtime.bailian-timeout-seconds=${IMAGE_RUNTIME_BAILIAN_TIMEOUT_SECONDS:600}
image.runtime.openai-timeout-seconds=${IMAGE_RUNTIME_OPENAI_TIMEOUT_SECONDS:300}
image.runtime.input-cleanup-cron=${IMAGE_RUNTIME_INPUT_CLEANUP_CRON:0 30 3 * * ?}
chat.image.wait-timeout-seconds=${CHAT_IMAGE_WAIT_TIMEOUT_SECONDS:30}
spring.task.scheduling.pool.size=2
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=8888

# File upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
file.upload-dir=./uploads

# CORS 跨域白名单（逗号分隔，支持通配符 *，为空则严格同源）
cors.allowed-origins=http://localhost:5174,http://localhost:5173,http://192.168.*:5174,http://192.168.*:5173,http://127.0.0.1:5174,http://127.0.0.1:5173

# Skill Import — gh-proxy 加速地址（用于 git clone 下载技能仓库）
skill.gh-proxy-url=https://gh-proxy.org

# LLM Configuration (also configurable via env vars LLM_API_KEY, LLM_MODEL, etc.)
# llm.api-url=https://api.openai.com/v1/chat/completions
# llm.api-key=sk-placeholder
# llm.model=gpt-4o-mini
# llm.max-tokens=2048
# llm.temperature=0.7
# llm.stream-timeout=60
# llm.connection-timeout=30
# llm.read-timeout=55
# llm.embedding-provider=ollama
# llm.embedding-api-url=http://localhost:11434
# llm.embedding-api-key=sk-placeholder
# llm.embedding-model=bge-m3:latest
# llm.embedding-dimension=1024
# llm.rag-search-limit=5
# llm.rag-similarity-threshold=0.15
# llm.rag-retrieval-timeout=8
# llm.rag-max-context-chars=8000

# Token 定价汇率（美元兑人民币）
token-pricing.usd-cny-rate=6.8

# Bright Data API（从 https://brightdata.com/cp/setting/users 获取 API Key）
# 优先使用环境变量 BRIGHT_API_KEY，其次使用此配置
brightdata.api-key=
brightdata.base-url=https://api.brightdata.com
brightdata.default-dataset-id=gd_l7q7dkf244hwjntr0

# Logging
logging.level.cafe.snails.ecomagents.service.AssetService=DEBUG

# Runtime observability (Prometheus scraping requires an ADMIN bearer token)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=ecomagents

# JWT Configuration（生产环境请通过 JWT_SECRET 环境变量覆盖）
jwt.secret=EcomAgents2024SecretKeyForJWTTokenGenerationMustBe256BitsLong
jwt.expiration=86400
