plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'cafe.snails'
version = '0.0.1-SNAPSHOT'
description = 'EcomAgents'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}


repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.agentscope:agentscope-spring-boot-starter:1.1.0-RC1'
    implementation 'io.agentscope:agentscope-harness:1.1.0-RC1'
    implementation 'io.agentscope:agentscope-extensions-rag-simple:1.1.0-RC1'
    implementation 'com.knuddels:jtokkit:1.1.0'
    implementation 'org.apache.pdfbox:pdfbox:3.0.4'
    implementation 'org.apache.poi:poi-ooxml:5.4.0'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.flywaydb:flyway-core'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    implementation 'com.aliyun:tea:1.4.2'
    implementation 'com.aliyun:credentials-java:1.0.4'
    implementation 'com.aliyun:imageenhan20190930:2.0.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

bootRun {
    jvmArgs = [
        '-Djdk.tls.client.protocols=TLSv1.2,TLSv1.3'
    ]
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'bailian-e2e'
    }
}

tasks.register('bailianE2eTest', Test) {
    group = 'verification'
    description = 'Runs opt-in, billable Aliyun Bailian image generation end-to-end tests.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'bailian-e2e'
    }
    shouldRunAfter tasks.named('test')
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.60
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
